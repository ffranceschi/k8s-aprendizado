apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    curso: gitops
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    version: 27.39.0
    helm:
      releaseName: prometheus
      parameters:
        - name: server.service.type
          value: "LoadBalancer"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoramento