apiVersion: v1
kind: Secret
metadata:
  name: segredo1
type: Opaque
data:
  # chaves da secret, por exemplo: usuario e senha em base64
  usuario: dXN1YXJpby1leGFtcGxv   # Exemplo base64 para 'usuario-exemplo'
  senha: c2VuaGEtZXhhbXBsZQ==     # Exemplo base64 para 'senha-exemplo'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: nginx-secret-volume
          mountPath: "/etc/nginx-secret"
          readOnly: true
      volumes:
      - name: nginx-secret-volume
        secret:
          secretName: segredo1

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
